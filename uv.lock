version = 1
revision = 3
requires-python = ">=3.14"

[manifest]
members = [
    "algo-repo",
    "data-cli",
    "infrastructure-entsoe",
]

[[package]]
name = "algo-repo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "data-cli" },
    { name = "infrastructure-entsoe" },
]

[package.metadata]
requires-dist = [
    { name = "data-cli", editable = "src/data_cli" },
    { name = "infrastructure-entsoe", editable = "src/infrastructure_entsoe" },
]

[[package]]
name = "data-cli"
version = "0.1.0"
source = { editable = "src/data_cli" }

[[package]]
name = "infrastructure-entsoe"
version = "0.1.0"
source = { editable = "src/infrastructure_entsoe" }
