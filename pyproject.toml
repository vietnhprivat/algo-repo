[project]
name = "algo-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "price-forecasting",
    "httpx>=0.28.1",
    "infrastructure-entsoe",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "polars>=1.37.1",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "ruff>=0.14.14",
    "scikit-learn>=1.8.0",
    "infrastructure-clickhouse",
    "clickhouse-connect>=0.10.0",
    "typer>=0.21.1",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.2.1",
    "ratelimit>=2.2.1",
    "typos>=1.43.3",
    "schedules",
    "prefect>=3.6.17",
    "data-cli",
    "forecast-cli",
    "python-dateutil>=2.9.0",
    "python-logging-loki>=0.3.1",
]

[tool.uv.workspace]
members = [
    "src/infrastructure_entsoe",
    "src/infrastructure_clickhouse",
    "src/domain",
    "src/price_forecasting",
    "src/schedules",
    "src/data_cli",
    "src/forecast_cli",
]

[tool.uv.sources]
domain = { workspace = true }
infrastructure-entsoe = { workspace = true }
infrastructure-clickhouse = { workspace = true }
price-forecasting = { workspace = true }
schedules = { workspace = true }
data-cli = { workspace = true }
forecast-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
