name: CD Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Rebuild image and redeploy flows on host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
        run: |
          tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
            set -euo pipefail
            cd "$REPO_PATH"
            git fetch origin main
            git reset --hard origin/main
            docker build -t algo-repo:latest .
            export PREFECT_API_URL="http://localhost:4200/api"
            uv run python src/schedules/src/schedules/deploy_ingestion.py
            uv run python src/schedules/src/schedules/deploy_forecast.py
          EOF

      - name: Trigger integration smoke run
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
        run: |
          tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
            set -euo pipefail
            cd "$REPO_PATH"
            export PREFECT_API_URL="http://localhost:4200/api"
            uv run python - <<'PY'
          import sys
          from prefect.deployments import run_deployment

          flow_run = run_deployment(
              name="daily-forecast/daily-forecast-dk1_lear",
              parameters={"target_date": "2026-03-22"},
              timeout=600,
          )
          state_type = flow_run.state.type.value if flow_run.state else "UNKNOWN"
          print(f"Flow run {flow_run.id} finished with state {state_type}")
          sys.exit(0 if state_type == "COMPLETED" else 1)
          PY
          EOF
