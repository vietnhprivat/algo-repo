name: PR Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/price_forecasting/**'
      - 'src/forecast_cli/**'
      - 'src/schedules/src/schedules/forecast.py'
      - 'src/schedules/src/schedules/reconciliation.py'
      - 'configs/smoke.py'
      - 'Dockerfile'
      - 'Dockerfile.worker'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/smoke/**'
      - 'docker-compose.yml'
      - '.github/workflows/pr_smoke.yml'

concurrency:
  group: pr-smoke-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: algo-repo
      # All Python steps run inside the algo-repo:latest image — no host uv sync.
      # Services are reachable by compose service name on the algo-repo_default network.
      DOCKER_RUN_ARGS: >-
        --rm -i
        --network algo-repo_default
        -e CLICKHOUSE_HOST=clickhouse
        -e CLICKHOUSE_PORT=8123
        -e CLICKHOUSE_USER=default
        -e CLICKHOUSE_PASSWORD=password
        -e CLICKHOUSE_DATABASE=algo
        -e PREFECT_API_URL=http://server:4200/api
        -e SLACK_WEBHOOK_URL=
        -e LOKI_URL=
        -e ENTSOE_API_KEY=
        -e SMOKE_CONFIGS_HOST_DIR=${{ github.workspace }}/configs
        -v ${{ github.workspace }}/tests:/app/tests
        -v ${{ github.workspace }}/configs:/app/configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history for the gated-paths diff in the next step.
          fetch-depth: 0

      # Skip the expensive smoke steps when the current push only touches
      # files outside the gated paths. The workflow-level `paths:` filter
      # above evaluates against the full PR diff, so a docs-only commit on
      # a PR that previously touched src/ still retriggers this workflow.
      # This step narrows the check to the delta introduced by the current
      # push (or by the PR for the first run) so docs-only pushes skip the
      # smoke while still satisfying any required-check rule.
      - name: Decide whether to run smoke
        id: check
        run: |
          set -eu
          ACTION='${{ github.event.action }}'
          BEFORE='${{ github.event.before }}'
          PR_BASE_SHA='${{ github.event.pull_request.base.sha }}'

          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            COMPARE="$BEFORE"
            echo "Synchronize: comparing against previous PR head $COMPARE"
          else
            COMPARE="$PR_BASE_SHA"
            echo "Action=$ACTION: comparing against PR base $COMPARE"
          fi

          CHANGED=$(git diff --name-only "$COMPARE" HEAD || true)
          echo "Changed files in this delta:"
          echo "$CHANGED"

          should_run=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/price_forecasting/*|src/forecast_cli/*|tests/smoke/*)
                should_run=true; break ;;
              src/schedules/src/schedules/forecast.py|src/schedules/src/schedules/reconciliation.py)
                should_run=true; break ;;
              configs/smoke.py|Dockerfile|Dockerfile.worker|pyproject.toml|uv.lock|docker-compose.yml)
                should_run=true; break ;;
              .github/workflows/pr_smoke.yml)
                should_run=true; break ;;
            esac
          done <<< "$CHANGED"

          echo "run_smoke=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "true" ]; then
            echo "Gated paths changed in this delta — running smoke."
          else
            echo "No gated paths in this delta — skipping smoke steps; job will report success."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.run_smoke == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build algo-repo image (flow runs)
        if: steps.check.outputs.run_smoke == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: algo-repo:latest
          # CPU-only torch — CI runner doesn't need (and can't fit) the CUDA wheel set.
          # Prod builds on the deploy host with the default cuda variant.
          build-args: |
            TORCH_VARIANT=cpu
          load: true
          cache-from: type=gha,scope=algo-repo-cpu
          cache-to: type=gha,mode=max,scope=algo-repo-cpu

      - name: Start clickhouse, prefect server, worker
        if: steps.check.outputs.run_smoke == 'true'
        run: docker compose up -d clickhouse server worker

      - name: Wait for ClickHouse readiness
        if: steps.check.outputs.run_smoke == 'true'
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8123/ping > /dev/null; then
              echo "ClickHouse ready"
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse not ready after 60s"
          docker compose logs clickhouse --tail 100
          exit 1

      - name: Wait for Prefect server readiness
        if: steps.check.outputs.run_smoke == 'true'
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4200/api/health > /dev/null; then
              echo "Prefect ready"
              exit 0
            fi
            sleep 2
          done
          echo "Prefect not ready after 120s"
          docker compose logs server --tail 100
          exit 1

      - name: Run migrations
        if: steps.check.outputs.run_smoke == 'true'
        run: docker run $DOCKER_RUN_ARGS algo-repo:latest python -m infrastructure_clickhouse.migrations.run_migrations

      - name: Seed synthetic data
        if: steps.check.outputs.run_smoke == 'true'
        run: docker run $DOCKER_RUN_ARGS algo-repo:latest python -m tests.smoke.seed

      - name: Register smoke deployments
        if: steps.check.outputs.run_smoke == 'true'
        run: docker run $DOCKER_RUN_ARGS algo-repo:latest python -m tests.smoke.deploy

      - name: Run daily-forecast-smoke deployment
        if: steps.check.outputs.run_smoke == 'true'
        run: |
          docker run $DOCKER_RUN_ARGS algo-repo:latest python - <<'PY'
          import sys
          from prefect.deployments import run_deployment

          flow_run = run_deployment(
              name="daily-forecast/daily-forecast-smoke",
              parameters={"target_date": "2025-06-01"},
              timeout=300,
          )
          state = flow_run.state.type.value if flow_run.state else "UNKNOWN"
          print(f"daily-forecast-smoke {flow_run.id} -> {state}")
          sys.exit(0 if state == "COMPLETED" else 1)
          PY

      - name: Run reconcile-predictions deployment
        if: steps.check.outputs.run_smoke == 'true'
        run: |
          docker run $DOCKER_RUN_ARGS algo-repo:latest python - <<'PY'
          import sys
          from prefect.deployments import run_deployment

          flow_run = run_deployment(
              name="reconcile-predictions/reconcile-predictions",
              timeout=180,
          )
          state = flow_run.state.type.value if flow_run.state else "UNKNOWN"
          print(f"reconcile-predictions {flow_run.id} -> {state}")
          sys.exit(0 if state == "COMPLETED" else 1)
          PY

      - name: Assert reconciled smoke run exists
        if: steps.check.outputs.run_smoke == 'true'
        run: docker run $DOCKER_RUN_ARGS algo-repo:latest python -m tests.smoke.assert_reconciled

      - name: Capture compose logs on failure
        if: failure() && steps.check.outputs.run_smoke == 'true'
        run: |
          mkdir -p /tmp/smoke-logs
          docker compose logs --no-color > /tmp/smoke-logs/compose.log 2>&1 || true
          docker compose ps > /tmp/smoke-logs/ps.txt 2>&1 || true
          docker ps -a > /tmp/smoke-logs/docker-ps.txt 2>&1 || true

      - name: Upload smoke logs on failure
        if: failure() && steps.check.outputs.run_smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.event.number }}
          path: /tmp/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always() && steps.check.outputs.run_smoke == 'true'
        run: docker compose down -v --remove-orphans || true
