name: Pull Request Tests

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install uv
        run: |
          pip install uv
      
      - name: Install dependencies
        run: |
          uv sync --frozen
      
      - name: Run linter
        run: |
          uv run ruff check .
        continue-on-error: true
      
      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ -v
        continue-on-error: true
      
      - name: Build Docker image
        run: |
          docker build -t algo-repo:pr-${{ github.event.pull_request.number }} .
      
      - name: Smoke test - verify imports
        run: |
          docker run --rm algo-repo:pr-${{ github.event.pull_request.number }} \
            python -c "
          from schedules.ingestion import entsoe_ingestion_flow
          from infrastructure_entsoe.main import main
          from infrastructure_clickhouse.ingest import insert_energy_prices_batch
          print('All imports successful')
          "
      
      - name: Test image can run
        run: |
          docker run --rm algo-repo:pr-${{ github.event.pull_request.number }} \
            python -c "
          from schedules.ingestion import entsoe_ingestion_flow
          print('Image can execute Python code')
          "
      
      - name: Show image info
        run: |
          docker images | grep algo-repo:pr-${{ github.event.pull_request.number }}
          echo "Image built and saved locally"
      
      - name: Cleanup old PR images (keep last 5)
        if: always()
        run: |
          # Remove PR images older than 7 days except the current one
          docker images | grep "algo-repo:pr-" | grep -v "pr-${{ github.event.pull_request.number }}" | \
            awk '{print $1":"$2}' | xargs -r docker rmi || true
