name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # cpu and cuda extras are mutually-exclusive (torch routing). Pick cpu
        # for CI to fit the runner; --all-extras would activate both and fail
        # the declared uv conflict.
        run: uv sync --extra cpu --dev

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)/src" >> $GITHUB_ENV

      - name: Run tests with pytest
        run: uv run pytest tests/ -v --tb=short
        timeout-minutes: 5
