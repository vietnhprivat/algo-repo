services:
  # ClickHouse Database — always running
  clickhouse:
    image: clickhouse/clickhouse-server:25.6.1
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: algo
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: always

  # Prefect Server (API + UI) — always running
  server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    ports:
      - "4200:4200"
    volumes:
      - prefect_storage:/root/.prefect

  # Prefect Docker Worker — always running, spawns ephemeral containers for flow runs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: prefect-worker
    restart: always
    depends_on:
      - server
    environment:
      PREFECT_API_URL: http://server:4200/api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Worker auto-creates the pool if it doesn't exist
    command: prefect worker start --pool docker-pool --type docker

volumes:
  clickhouse_data:
  prefect_storage:
