services:
  # ClickHouse Database — always running
  clickhouse:
    image: clickhouse/clickhouse-server:25.6.1
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: algo
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    restart: always

  # Prefect Server (API + UI) — always running
  server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      # The UI runs in the browser, so it must call the API at a host the
      # client can reach. Default is http://0.0.0.0:4200/api, which only
      # resolves from the host itself, so remote access breaks (e.g. over
      # Tailscale from another machine). Point it at the tailnet MagicDNS
      # name, which resolves from both the host and any tailnet peer.
      PREFECT_UI_API_URL: "http://fedora.tailf19320.ts.net:4200/api"
    ports:
      - "4200:4200"
    volumes:
      - prefect_storage:/root/.prefect

  # Prefect Docker Worker — always running, spawns ephemeral containers for flow runs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: prefect-worker
    restart: always
    depends_on:
      - server
    environment:
      PREFECT_API_URL: http://server:4200/api
      LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Worker auto-creates the pool if it doesn't exist
    command: prefect worker start --pool docker-pool --type docker

  # Loki log aggregation — receives structured Python logs directly
  loki:
    image: grafana/loki:3.4.2
    container_name: grafana-loki
    restart: always
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  # Grafana dashboards — auto-provisioned from the repo
  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    restart: always
    depends_on:
      - clickhouse
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: algo
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
      LOKI_URL: http://loki:3100
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus metrics scraper — scrapes ClickHouse, Grafana, and itself
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=120d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - clickhouse
      - grafana

volumes:
  clickhouse_data:
  prefect_storage:
  grafana_data:
  loki_data:
  prometheus_data:
