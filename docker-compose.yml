services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.6.1
    container_name: clickhouse-server
    ports:
      - "8123:8123"  
      - "9000:9000" 
    environment:
      CLICKHOUSE_DB: algo
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  clickhouse_data:
