services:
  # ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:25.6.1
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: algo
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: always

  # Prefect Server (API + UI)
  server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_storage:/root/.prefect

  worker:
    image: prefecthq/prefect:3-latest
    container_name: prefect-worker
    restart: always
    depends_on:
      - server
      - clickhouse
    environment:
      - PREFECT_API_URL=http://server:4200/api
      - DOCKER_NETWORK=algo-repo_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      bash -c "pip install prefect-docker && prefect worker start --pool docker-pool --type docker"

volumes:
  clickhouse_data:
  prefect_storage: