apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: ${CLICKHOUSE_DATABASE}
      host: ${CLICKHOUSE_HOST}
      port: ${CLICKHOUSE_PORT}
      protocol: http
      username: ${CLICKHOUSE_USER}
      tlsSkipVerify: true
      logs:
        defaultTable: experiment_predictions
        otelEnabled: false
      traces:
        otelEnabled: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    jsonData:
      maxLines: 1000
